[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faasr-ai"
version = "0.1.0"
description = "A multi-agent system for request clarification, workflow planning, code generation, execution, and automated log triage with reflection loops."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "faasr-py",
  "anthropic>=0.40.0",
  "openai>=1.40.0",
  "langgraph>=0.0.40",
  "langchain-core>=0.3.0",
  "python-dotenv>=1.0.0",
  "pygithub>=2.8.1",
  "pydantic>=2.7.0",
  "pandas>=2.0.0",
  "numpy>=1.26.0",
  "nbclient>=0.10.0",
  "nbformat>=5.10.4",
  "ipykernel>=6.29.0",
  "boto3>=1.34.0",
  "rich>=13.0.0",
  "jsonschema>=4.0.0",
  "readchar>=4.0.0",
  "autoflake>=2.0.0",
  "claude-agent-sdk>=0.1.50",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.40.70",
]

[tool.uv.sources]
faasr-py = { path = "/Users/nolancc/Documents/GitHub/FaaSr-Backend", editable = true }
